<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e64010">
<title>Studium na VŠCHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Varianta C „Deník" podle online manuálu VŠCHT (červená #e64010, černá, lososové doplňky). */
  :root{
    --red:#e64010; --black:#111; --white:#fff;
    --peach:#fff4ef; --salmon:#ef8364; --grey:#d9d9d9;
    --ink:#161412; --muted:#5d4c46; --bg:#f9d3c8; --card:#fff;
    --good:#1f8a4c; --bad:#c0271b;
    --c-f:#4a8af0; --c-v:#e64010; --c-p:#f2a33a;
    --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;min-height:100svh;display:flex;flex-direction:column}
  .shell{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:5;background:var(--red);color:var(--white);padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
  .logo{font-weight:900;font-stretch:112%;letter-spacing:.02em;font-size:15px;background:#111;color:#fff;padding:4px 8px;border-radius:3px}
  .logo small{font-weight:600;opacity:.85;margin-left:4px;font-size:11px;letter-spacing:.08em}
  .hdr-info{font-size:12px;opacity:.9;line-height:1.2}
  .hdr-wallet{margin-left:auto;text-align:right;line-height:1.1}
  .hdr-wallet .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  .hdr-wallet .val{font-family:var(--mono);font-weight:600;font-size:17px}

  main{flex:1;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
  h1{font-size:34px;line-height:1.02;font-weight:900;font-stretch:118%;text-wrap:balance;margin:0}
  h2{font-size:24px;line-height:1.1;font-weight:850;font-stretch:112%;text-wrap:balance;margin:0}
  p{margin:0}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#111}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:18px}

  .btn{appearance:none;font:inherit;font-weight:800;font-stretch:108%;font-size:17px;padding:16px 18px;border-radius:999px;background:#111;color:#fff;border:2px solid #111;box-shadow:4px 4px 0 var(--red);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:hover{background:var(--red)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:#fff;color:#111;box-shadow:4px 4px 0 #111}
  .btn.ghost:hover{background:#111;color:#fff}
  .btn:focus-visible,.opt:focus-visible,.linkbtn:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .linkbtn{background:none;border:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px;align-self:center}

  .ellipse-hero{position:relative;padding:28px 4px 8px}
  .ellipse-hero svg{position:absolute;inset:-10px -30px auto auto;width:260px;height:180px;pointer-events:none}

  .card,.st,.opt,.tip,.cat{border:2px solid #111;box-shadow:4px 4px 0 #111;border-radius:14px}
  .card{background:var(--card);padding:18px;display:flex;flex-direction:column;gap:12px}
  .rules{display:grid;gap:10px}
  .rule{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:15px}
  .rule b{display:block}
  .ico{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:700}
  input[type=text]{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid #111;background:#fff;width:100%;min-width:0}
  .manual{display:flex;gap:8px}
  .manual input{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
  .manual .btn{width:auto;padding:12px 18px;flex:none}

  .alert{border:2px solid var(--bad);background:#fff;color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
  .alert.info{border-color:#111;color:#111;background:var(--peach)}

  .stations{display:flex;flex-direction:column;gap:10px}
  .st{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--card);padding:12px}
  .st .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:var(--mono);border:2px solid var(--grey);color:var(--muted)}
  .st.done .n{background:#111;border-color:#111;color:#fff}
  .st.cur{background:var(--peach)}
  .st.cur .n{background:var(--red);border-color:var(--red);color:#fff}
  .st .t{font-weight:750;font-size:15px}
  .st .s{font-size:13px;color:var(--muted)}
  .st .r{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .st.locked .t{color:var(--muted)}

  .scan{aspect-ratio:1;width:100%;background:#1b1918;border-radius:22px;border:2px solid #111;position:relative;overflow:hidden}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan .corner{position:absolute;width:46px;height:46px;border:5px solid var(--red)}
  .c1{top:18%;left:18%;border-right:0!important;border-bottom:0!important;border-radius:10px 0 0 0}
  .c2{top:18%;right:18%;border-left:0!important;border-bottom:0!important;border-radius:0 10px 0 0}
  .c3{bottom:18%;left:18%;border-right:0!important;border-top:0!important;border-radius:0 0 0 10px}
  .c4{bottom:18%;right:18%;border-left:0!important;border-top:0!important;border-radius:0 0 10px 0}
  .scanline{position:absolute;left:20%;right:20%;height:2px;background:var(--salmon);box-shadow:0 0 12px var(--salmon);animation:scan 2.2s ease-in-out infinite alternate}
  @keyframes scan{from{top:22%}to{top:78%}}
  .scan .hint{color:#fff;font-size:13px;position:absolute;bottom:14px;left:0;right:0;text-align:center;padding:0 16px;text-shadow:0 1px 2px #000}

  .num-badge{display:inline-flex;align-items:baseline;gap:8px;color:var(--ink);font-size:16px;font-weight:800;align-self:flex-start}
  .num-badge .big{font-family:var(--f);font-size:96px;font-weight:900;font-stretch:125%;color:var(--red);line-height:.8;letter-spacing:-.04em}
  .story{position:relative;font-size:17px;line-height:1.55;background:#fff;border:2px solid #111;border-radius:18px 18px 18px 4px;padding:16px 18px;box-shadow:4px 4px 0 #111}
  .group-banner{background:#111;color:#fff;border-radius:14px;box-shadow:4px 4px 0 var(--red);padding:16px;display:flex;flex-direction:column;gap:6px}
  .group-banner b{font-size:20px;font-stretch:110%;color:var(--salmon)}
  .q{font-weight:800;font-size:19px;font-stretch:106%;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{appearance:none;text-align:left;font:inherit;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:var(--card);padding:14px;cursor:pointer;color:var(--ink);transition:transform .12s, box-shadow .12s}
  .opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}
  .opt .k{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;text-transform:uppercase}
  .opt .d{font-size:13px;color:var(--bad);display:block;margin-top:4px;font-weight:700}
  .opt:disabled{opacity:.7;cursor:not-allowed;box-shadow:none;background:repeating-linear-gradient(-45deg,#fff 0 8px,#f3e2dc 8px 16px)}
  .opt:disabled .k{background:var(--grey);color:var(--muted)}

  .deltas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .dl{border:2px solid #111;border-radius:12px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:2px}
  .dl .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dl .v{font-family:var(--mono);font-weight:600;font-size:22px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .tip{background:var(--card);padding:14px 16px;font-size:15px}
  .tip b{display:block;margin-bottom:4px;color:var(--red)}

  .final-hero{background:#111;color:#fff;border-radius:14px;box-shadow:6px 6px 0 var(--red);padding:22px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
  .final-hero svg{position:absolute;right:-60px;top:-40px;width:260px;height:200px;pointer-events:none}
  .final-hero .big{font-family:var(--mono);font-size:64px;font-weight:600;color:var(--salmon);line-height:1}
  .final-hero .rank{font-size:20px;font-weight:850;font-stretch:110%}
  .profile .name{font-size:28px;font-weight:900;font-stretch:118%;line-height:1}
  .cats{display:flex;flex-direction:column;gap:10px}
  .cat{background:var(--card);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .cat .nm{font-weight:800;display:flex;align-items:center;gap:8px}
  .cat .v{font-family:var(--mono);font-size:20px;font-weight:600;text-align:right}
  .cat .rk{grid-column:1 / -1;font-size:13px;color:var(--muted)}
  .cat .track{grid-column:1 / -1;height:8px;border-radius:999px;background:#eee;overflow:hidden}
  .cat .track span{display:block;height:100%}

  /* dolní lišta: tři metriky */
  .metricbar{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:#111;border-top:2px solid #111;padding-bottom:env(safe-area-inset-bottom)}
  .mb{background:var(--mc);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;min-width:0}
  .mb + .mb{border-left:2px solid #111}
  .mb .num{font-family:var(--mono);font-size:20px;font-weight:600;color:#fff;line-height:1}
  .mb .nm{font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff}
  .mb.bump{animation:bump .6s ease-out}
  @keyframes bump{30%{transform:scale(1.12)}}

  .fade{animation:fade .28s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade,.scanline,.mb.bump{animation:none}.opt{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="logo">VŠCHT<small>PRAHA</small></span>
    <div class="hdr-info" id="hdrInfo"></div>
    <div class="hdr-wallet" id="hdrWallet" hidden><div class="lbl">Úspory</div><div class="val" id="hdrKc">0 Kč</div></div>
  </header>
  <main id="app"></main>
  <nav class="metricbar" id="metricbar" hidden aria-label="Tvoje body"></nav>
</div>

<script>
// ---------------------------------------------------------------------------
//  Aplikace pro hráče. Všechno důležité (body, Kč, trasa, pořadí) počítá
//  server – tady se jen zobrazuje stav, který vrátí API.
// ---------------------------------------------------------------------------
const STORE_KEY = "dodCode";
const METRIC_KEYS = ["f", "v", "p"];
let CFG = null;      // /api/config – názvy a barvy metrik
let ST = null;       // poslední stav hráče ze serveru
let pendingQr = null; // kód z adresy ?qr=…, který se má po startu odemknout
let prevMetrics = null;

const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtKc = (n) => (n < 0 ? "−" : "") + Math.round(Math.abs(n)).toLocaleString("cs-CZ") + " Kč";
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("cs-CZ");
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");

function storeGet() { try { return localStorage.getItem(STORE_KEY); } catch { return null; } }
function storeSet(v) { try { v ? localStorage.setItem(STORE_KEY, v) : localStorage.removeItem(STORE_KEY); } catch {} }

// ---- API ------------------------------------------------------------------
async function api(path, body) {
  const res = await fetch(path, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Něco se pokazilo, zkus to znovu."), { status: res.status });
  return data;
}

// ---- Rám: hlavička a dolní lišta ------------------------------------------
function chrome() {
  const on = !!ST;
  document.getElementById("hdrWallet").hidden = !on;
  document.getElementById("metricbar").hidden = !on;
  if (!on) { document.getElementById("hdrInfo").textContent = ""; return; }
  document.getElementById("hdrKc").textContent = fmtKc(ST.kc);
  document.getElementById("hdrInfo").innerHTML =
    `${ST.result ? "Cíl" : `Stanoviště ${ST.current + 1}/${ST.route.length}`}<br><span class="mono">${esc(ST.code)}</span>`;
  document.getElementById("metricbar").innerHTML = METRIC_KEYS.map((k) => {
    const m = CFG.metrics[k];
    const bump = prevMetrics && prevMetrics[k] !== ST.metrics[k] ? " bump" : "";
    return `<div class="mb${bump}" style="--mc:${m.color}"><span class="num">${signed(ST.metrics[k])}</span><span class="nm">${esc(m.name)}</span></div>`;
  }).join("");
  prevMetrics = { ...ST.metrics };
}

function render(html) {
  $app.innerHTML = `<div class="fade stack">${html}</div>`;
  chrome();
  window.scrollTo(0, 0);
}

function ellipseSVG(stroke) {
  return `<svg viewBox="0 0 260 180" aria-hidden="true"><ellipse cx="150" cy="80" rx="120" ry="62" fill="none" stroke="${stroke}" stroke-width="2" transform="rotate(-14 150 80)"/><ellipse cx="150" cy="80" rx="96" ry="44" fill="none" stroke="${stroke}" stroke-width="1" opacity=".5" transform="rotate(-14 150 80)"/></svg>`;
}
const alertBox = (msg, info) => msg ? `<div class="alert${info ? " info" : ""}" role="alert">${esc(msg)}</div>` : "";

// Podle stavu ze serveru vybere správnou obrazovku.
function show(msg, info) {
  if (ST.result) return vFinal();
  if (ST.arrived && !ST.taskDone) return vTask(msg, info);
  if (ST.arrived) return vStation(msg);
  return vRoute(msg, info);
}

// ---- Úvod ------------------------------------------------------------------
function vIntro(msg) {
  ST = null;
  const m = CFG.metrics;
  // Hráč naskenoval QR, ale tenhle prohlížeč ho nezná (např. fotoaparát otevřel
  // odkaz v jiném prohlížeči). Nejdřív nabídneme obnovení, ať nezačne od nuly.
  const restoreBox = `
    <details class="card" style="gap:10px" ${pendingQr ? "open" : ""}>
      <summary style="cursor:pointer;font-weight:700">Už hraješ? Obnov hru kódem</summary>
      <div class="manual">
        <label for="restore" style="position:absolute;left:-9999px">Hrací kód</label>
        <input type="text" id="restore" placeholder="DOD-XXXX" autocomplete="off">
        <button class="btn ghost" onclick="restore()">Obnovit</button>
      </div>
    </details>`;
  render(`
    <div class="ellipse-hero">
      ${ellipseSVG("#e64010")}
      <div class="eyebrow">Den otevřených dveří · Holešovice, Jankovcova</div>
      <h1 style="margin-top:10px">Tvoje studium<br>na VŠCHT</h1>
    </div>
    ${alertBox(msg)}
    ${pendingQr ? restoreBox : ""}
    <p class="story">Zkus si nanečisto celé studium: bydlení, zkouškové, Erasmus i první výplatu. Projdeš ${CFG.routeLength} stanovišť, na každém tě čeká kus příběhu a jedno rozhodnutí. Na konci uvidíš, jak jsi dopadl/a a jak sis vedl/a proti ostatním.</p>
    <div class="rules">
      <div class="rule"><span class="ico">QR</span><div><b>Stanoviště jdou popořadě</b><span class="muted">Každé odemkneš naskenováním QR kódu na místě.</span></div></div>
      <div class="rule"><span class="ico">3×</span><div><b>Sbíráš body ve třech oblastech</b><span class="muted"><b style="color:${m.f.color}">${esc(m.f.name)}</b>, <b style="color:${m.v.color}">${esc(m.v.name)}</b> a <b style="color:#c47a12">${esc(m.p.name)}</b>. Uvidíš je dole na liště.</span></div></div>
      <div class="rule"><span class="ico">Kč</span><div><b>Začínáš s ${fmtKc(CFG.startKc)}</b><span class="muted">Některé možnosti si musíš umět dovolit.</span></div></div>
      <div class="rule"><span class="ico">✈</span><div><b>Tvoje volby rozhodnou o Erasmu</b><span class="muted">Podle bodů se trasa v půlce rozdělí.</span></div></div>
    </div>
    <div class="field">
      <label for="nick">Přezdívka do žebříčku (nepovinné, nepiš celé jméno)</label>
      <input type="text" id="nick" maxlength="40" autocomplete="off" placeholder="např. Chemik007">
    </div>
    <button class="btn" id="startBtn" onclick="start()">${pendingQr ? "Ne, začínám novou hru" : "Začít hru"}</button>
    ${pendingQr ? "" : restoreBox}
  `);
}

async function start() {
  const btn = document.getElementById("startBtn");
  btn.disabled = true;
  try {
    ST = await api("/api/register", { nickname: document.getElementById("nick").value });
    storeSet(ST.code);
    vCode();
  } catch (e) { btn.disabled = false; vIntro(e.message); }
}

async function restore() {
  let code = document.getElementById("restore").value.trim().toUpperCase();
  if (code && !code.startsWith("DOD-")) code = "DOD-" + code;
  try {
    ST = await api("/api/me/" + encodeURIComponent(code));
    storeSet(ST.code);
    if (pendingQr) { const t = pendingQr; pendingQr = null; return unlock(t); }
    show("Hra obnovena. Pokračuj tam, kde jsi skončil/a.", true);
  } catch (e) { vIntro(e.status === 404 ? "Tenhle kód neznáme. Zkontroluj ho." : e.message); }
}

function vCode() {
  render(`
    <div class="eyebrow">Tvůj hrací kód</div>
    <div class="card" style="align-items:center;padding:28px 18px">
      <div class="mono" style="font-size:40px;font-weight:600;letter-spacing:.06em">${esc(ST.code)}</div>
      <p class="muted" style="text-align:center">Vyfoť si ho. Kdyby se ti zavřel prohlížeč, hru s ním obnovíš.</p>
    </div>
    <div class="card"><p><b>Startuješ s ${fmtKc(ST.kc)}</b> naspořenými od rodičů a z brigády. Dole na liště uvidíš své body.</p></div>
    <button class="btn" onclick="afterStart()">Jdeme na to</button>
  `);
}
function afterStart() {
  if (pendingQr) { const t = pendingQr; pendingQr = null; return unlock(t); }
  vRoute();
}

// ---- Trasa a skenování ------------------------------------------------------
function vRoute(msg, info) {
  stopScan();
  const rows = ST.route.map((r, i) => {
    const s = i < ST.current ? "done" : i === ST.current ? "cur" : "locked";
    // Za Přístavem se trasa liší – dokud hráč neví, kam půjde, nevidí pořadí.
    const hidden = s === "locked" && !ST.group && i > 5 && i < ST.route.length - 2;
    const name = hidden ? "Podle tvých bodů" : r.place;
    const right = s === "done" ? "hotovo" : s === "cur" ? "teď" : "🔒";
    return `<div class="st ${s}"><span class="n">${i + 1}</span><div><div class="t">${esc(name)}</div></div><span class="r">${right}</span></div>`;
  }).join("");
  const next = ST.route[ST.current];
  render(`
    <div><div class="eyebrow">Trasa · ${ST.current}/${ST.route.length} hotovo</div>
      <h2 style="margin-top:6px">Další zastávka: ${esc(next.place)}</h2></div>
    ${alertBox(msg, info)}
    <button class="btn" onclick="vScan()">Naskenovat QR</button>
    <div class="manual">
      <label for="manualCode" style="position:absolute;left:-9999px">Kód stanoviště</label>
      <input type="text" id="manualCode" placeholder="Nejde to? Opiš kód" maxlength="12" autocomplete="off">
      <button class="btn ghost" onclick="manualUnlock()">OK</button>
    </div>
    <div class="stations">${rows}</div>
    <p class="muted" style="font-size:13px;text-align:center">Tvůj kód pro obnovení hry: <b class="mono">${esc(ST.code)}</b></p>
  `);
}

function manualUnlock() {
  const v = document.getElementById("manualCode").value.trim();
  if (v) unlock(v);
}

async function unlock(token) {
  stopScan();
  try {
    ST = await api("/api/unlock", { code: ST.code, token });
    show(ST.notice, true);
  } catch (e) {
    if (e.status === 404) { storeSet(null); return vIntro(e.message); }
    ST.arrived && !ST.taskDone ? vTask(e.message) : vRoute(e.message);
  }
}

// Z naskenovaného textu vytáhne kód (QR obsahuje odkaz …/?qr=KOD).
function tokenFrom(text) {
  try { const q = new URL(text).searchParams.get("qr"); if (q) return q; } catch {}
  return text.trim();
}

// Čtečka QR: BarcodeDetector (Chrome/Android), jinak knihovna jsQR (iPhone).
let scan = null;
function vScan(back) {
  render(`
    <div><div class="eyebrow">${back === "task" ? "Úkol" : `Stanoviště ${ST.current + 1}`}</div>
      <h2 style="margin-top:6px">${back === "task" ? "Naskenuj QR od obsluhy" : "Naskenuj QR kód na místě"}</h2></div>
    <div class="scan"><video id="video" playsinline muted></video>
      <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
      <span class="scanline"></span><span class="hint" id="scanHint">Spouštím kameru…</span></div>
    <button class="btn ghost" onclick="${back === "task" ? "vTask()" : "vRoute()"}">Zpět</button>
  `);
  startScan(back);
}

async function startScan() {
  const hint = document.getElementById("scanHint");
  const video = document.getElementById("video");
  if (!navigator.mediaDevices?.getUserMedia) { hint.textContent = "Tenhle prohlížeč kameru nepodporuje. Opiš kód pod QR."; return; }
  let detect;
  try {
    if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) {
      const bd = new BarcodeDetector({ formats: ["qr_code"] });
      detect = async () => (await bd.detect(video))[0]?.rawValue;
    } else {
      await loadJsQR();
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      detect = async () => {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        if (!canvas.width) return null;
        ctx.drawImage(video, 0, 0);
        return jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height)?.data;
      };
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    scan = { stream, timer: null };
    video.srcObject = stream;
    await video.play();
    hint.textContent = "Namiř kameru na QR kód";
    const tick = async () => {
      if (!scan) return;
      try {
        const text = await detect();
        if (text) { navigator.vibrate?.(80); return unlock(tokenFrom(text)); }
      } catch {}
      if (scan) scan.timer = setTimeout(tick, 250);
    };
    tick();
  } catch (e) {
    stopScan();
    hint.textContent = e.name === "NotAllowedError"
      ? "Kamera není povolená. Povol ji v nastavení prohlížeče, nebo se vrať a opiš kód."
      : "Kameru se nepodařilo spustit. Vrať se a opiš kód pod QR.";
  }
}
function stopScan() {
  if (!scan) return;
  clearTimeout(scan.timer);
  scan.stream.getTracks().forEach((t) => t.stop());
  scan = null;
}
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

// ---- Stanoviště --------------------------------------------------------------
function stationHead() {
  const s = ST.station;
  return `
    <span class="num-badge"><span class="big">${s.num}</span>/ ${ST.route.length}</span>
    <div><div class="eyebrow">${esc(s.place)}</div><h2 style="margin-top:6px">${esc(s.title)}</h2></div>`;
}

function vTask(msg) {
  render(`
    ${stationHead()}
    ${alertBox(msg)}
    <div class="card"><div class="eyebrow">Úkol</div><p>${esc(ST.station.taskText)}</p></div>
    <p class="muted">Až úkol splníš, obsluha ti ukáže QR kód. Naskenuj ho a pokračuj.</p>
    <button class="btn" onclick="vScan('task')">Naskenovat QR od obsluhy</button>
    <div class="manual">
      <input type="text" id="manualCode" placeholder="Nebo opiš kód" maxlength="12" autocomplete="off" aria-label="Kód úkolu">
      <button class="btn ghost" onclick="manualUnlock()">OK</button>
    </div>
  `);
}

function vStation(msg) {
  const s = ST.station;
  const opts = s.opts.map((o, j) => `
    <button class="opt" ${o.locked ? "disabled" : ""} onclick="answer(${j}, this)">
      <span class="k">${"abcdef"[j]}</span>
      <span>${esc(o.t)}${o.locked ? `<span class="d">🔒 ${esc(o.lockText)}</span>` : ""}</span>
    </button>`).join("");
  render(`
    ${stationHead()}
    ${alertBox(msg)}
    ${s.group ? `<div class="group-banner"><b>${esc(s.group.name)}</b><span>${esc(s.group.why)}</span></div>` : ""}
    <p class="story">${esc(s.story)}</p>
    <p class="q">${esc(s.q)}</p>
    <div class="opts">${opts}</div>
  `);
}

async function answer(choice, el) {
  document.querySelectorAll(".opt").forEach((b) => (b.disabled = true));
  el.style.background = "var(--peach)";
  const station = ST.station;
  try {
    const res = await api("/api/answer", { code: ST.code, station: station.id, choice });
    ST = res;
    vResult(station, res.answer);
  } catch (e) {
    try { ST = await api("/api/me/" + ST.code); } catch {}
    show(e.message);
  }
}

function vResult(station, a) {
  const m = CFG.metrics;
  const tiles = METRIC_KEYS.map((k) => `
    <div class="dl"><span class="lbl"><span class="dot" style="background:${m[k].color}"></span>${esc(m[k].name)}</span>
      <span class="v ${cls(a.fx[k])}">${signed(a.fx[k])}</span></div>`).join("");
  const quiz = a.correct === null ? "" : a.correct
    ? `<div class="alert info" style="border-color:var(--good);color:var(--good)">Správně!</div>`
    : `<div class="alert">Tohle není správně.</div>`;
  const nextName = ST.result ? "" : ST.route[ST.current].place;
  render(`
    <div class="eyebrow">${esc(station.place)} · hotovo</div>
    <div class="card">
      <div class="muted" style="font-size:14px">Tvoje volba</div>
      <p style="font-weight:700">${esc(a.choiceText)}</p>
      ${a.result ? `<p>${esc(a.result)}</p>` : ""}
    </div>
    ${quiz}
    <div class="deltas">
      ${tiles}
      <div class="dl"><span class="lbl"><span class="dot" style="background:#111"></span>Úspory</span>
        <span class="v ${cls(a.kc)}">${a.kc ? (a.kc > 0 ? "+" : "") + fmtKc(a.kc) : "0 Kč"}</span></div>
    </div>
    <button class="btn" onclick="vRoute()">${nextName ? `Pokračovat: ${esc(nextName)}` : "Pokračovat"}</button>
  `);
}

// ---- Cíl ---------------------------------------------------------------------
function vFinal() {
  stopScan();
  const r = ST.result, m = CFG.metrics;
  const color = (k) => (k === "p" ? "#c47a12" : m[k].color); // žlutá je na bílé málo čitelná
  const cats = METRIC_KEYS.map((k) => `
    <div class="cat">
      <span class="nm"><span class="dot" style="background:${m[k].color}"></span>${esc(m[k].name)}</span>
      <span class="v ${cls(r.metrics[k])}">${signed(r.metrics[k])}</span>
      <span class="rk">${r.categories[k].rank}. místo z ${r.of} v kategorii</span>
    </div>`).join("");
  render(`
    <div class="final-hero">
      ${ellipseSVG("#e64010")}
      <div class="eyebrow" style="color:var(--salmon)">Promoce · tvoje Životní skóre</div>
      <div class="big">${r.score}<span style="font-size:24px;opacity:.7"> / 100</span></div>
      <div class="rank">${r.rank}. místo z ${r.of}</div>
      <div><b style="font-size:18px">${esc(r.band.t)}</b><br><span style="opacity:.85">${esc(r.band.d)}</span></div>
    </div>
    <div class="card profile">
      <div class="eyebrow">Tvůj profil</div>
      <div class="name" style="color:${color(r.profile.id)}">${esc(r.profile.name)}</div>
      <p>${esc(r.profile.text)}</p>
    </div>
    <div class="cats">${cats}
      <div class="cat"><span class="nm"><span class="dot" style="background:#111"></span>Úspory</span>
        <span class="v ${r.kc < 0 ? "neg" : ""}">${fmtKc(r.kc)}</span>
        ${r.kc < 0 ? `<span class="rk">Studium jsi zakončil/a v dluhu.</span>` : ""}</div>
    </div>
    <div class="card" style="background:var(--red);color:#fff">
      <b style="font-size:18px">Ukaž tuhle obrazovku v cíli</b>
      <span>Ceny dostane celkově nejlepší hráč a nejlepší v každé kategorii. Pořadí se mění, jak dobíhají další hráči.</span>
    </div>
    <button class="btn ghost" onclick="refresh()">Aktualizovat pořadí</button>
    <button class="linkbtn" onclick="newGame()">Začít novou hru</button>
  `);
}

async function refresh() {
  try { ST = await api("/api/me/" + ST.code); show(); } catch (e) { vFinal(); }
}
function newGame() {
  if (!confirm("Opravdu začít znovu? Tahle hra zůstane uložená pod kódem " + ST.code + ".")) return;
  storeSet(null);
  vIntro();
}

// ---- Start aplikace ----------------------------------------------------------
(async function boot() {
  const params = new URLSearchParams(location.search);
  pendingQr = params.get("qr");
  if (pendingQr) history.replaceState(null, "", location.pathname); // ať se kód neodemyká znovu při obnovení stránky
  try {
    CFG = await api("/api/config");
  } catch {
    $app.innerHTML = alertBox("Nepodařilo se spojit se serverem. Zkontroluj internet a obnov stránku.");
    return;
  }
  const code = storeGet();
  if (code) {
    try { ST = await api("/api/me/" + encodeURIComponent(code)); } catch { storeSet(null); ST = null; }
  }
  if (!ST) return vIntro(pendingQr ? "Naskenoval/a jsi QR kód. Pokud už hraješ, zadej svůj kód DOD-XXXX a stanoviště se odemkne." : "");
  if (pendingQr) { const t = pendingQr; pendingQr = null; return unlock(t); }
  show();
})();
</script>
