<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Žebříček DOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* Obrazovka do cíle (DOX) – velký monitor / projektor, obnovuje se sama. */
  :root{
    --red:#e64010; --salmon:#ef8364; --bg:#f9d3c8; --ink:#161412; --muted:#5d4c46;
    --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);height:100%}
  body{color:var(--ink);font-family:var(--f);display:flex;flex-direction:column;font-size:clamp(14px,1.2vw,22px)}
  header{background:var(--red);color:#fff;padding:1.1em 2em;display:flex;align-items:center;gap:1.2em}
  .logo{font-weight:900;font-stretch:112%;background:#111;color:#fff;padding:.25em .5em;border-radius:3px}
  header h1{margin:0;font-size:2.2em;font-weight:900;font-stretch:118%;line-height:1}
  .stats{margin-left:auto;display:flex;gap:2em;text-align:right}
  .stats b{display:block;font-family:var(--mono);font-size:1.8em;line-height:1}
  .stats span{font-size:.75em;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  main{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:1.6em;padding:1.6em 2em;min-height:0}
  @media (max-width:800px){main{grid-template-columns:1fr}}
  .card{background:#fff;border:2px solid #111;box-shadow:.25em .25em 0 #111;border-radius:14px;padding:1em 1.2em;min-width:0}
  h2{margin:0 0 .5em;font-size:1.3em;font-weight:850;font-stretch:110%}
  .eyebrow{font-size:.7em;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .board{display:flex;flex-direction:column;gap:.35em}
  .row{display:grid;grid-template-columns:2.4em 1fr auto auto;gap:.8em;align-items:center;padding:.35em .5em;border-radius:10px}
  .row .rk{font-family:var(--mono);font-weight:600;font-size:1.2em;text-align:right}
  .row .nm{font-weight:800;font-size:1.15em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .pf{font-size:.8em;color:var(--muted);white-space:nowrap}
  .row .sc{font-family:var(--mono);font-weight:600;font-size:1.4em;min-width:2.2em;text-align:right}
  .row.top{background:#111;color:#fff}
  .row.top .pf{color:#ddd}
  .row.top .sc{color:var(--salmon)}
  .side{display:flex;flex-direction:column;gap:1.2em;min-height:0}
  .cats{display:grid;grid-template-columns:1fr;gap:1em}
  .cat{border-left:.5em solid var(--c)}
  .cat ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:.2em}
  .cat li{font-weight:700}
  .cat li span{font-family:var(--mono);color:var(--muted);font-weight:500;margin-left:.4em}
  .join{display:flex;gap:1.2em;align-items:center;background:#111;color:#fff;box-shadow:.25em .25em 0 var(--red)}
  .join .qr{width:8em;flex:none;background:#fff;border-radius:8px;padding:.3em}
  .join .qr svg{display:block;width:100%;height:auto}
  .join b{font-size:1.4em;font-stretch:110%;display:block}
  .empty{color:var(--muted);font-size:1.1em;padding:1em 0}
  .err{position:fixed;bottom:.6em;right:.8em;font-size:.75em;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="logo">VŠCHT</span>
  <h1>Žebříček dne</h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="card">
    <h2>Celkové pořadí · Životní skóre</h2>
    <div class="board" id="board"></div>
  </section>
  <div class="side">
    <div class="cats" id="cats"></div>
    <div class="card join">
      <div class="qr" id="joinQr"></div>
      <div><b>Zahraj si taky!</b>Naskenuj QR a vyzkoušej si studium na VŠCHT nanečisto.</div>
    </div>
  </div>
</main>
<div class="err" id="err"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
let METRICS = null;

async function load() {
  try {
    if (!METRICS) METRICS = (await (await fetch("/api/config")).json()).metrics;
    const d = await (await fetch("/api/leaderboard")).json();
    $("stats").innerHTML = `<div><b>${d.stats.total}</b><span>hraje</span></div><div><b>${d.stats.finished}</b><span>v cíli</span></div>`;
    $("board").innerHTML = d.board.slice(0, 12).map((r) => `
      <div class="row ${r.rank <= 3 ? "top" : ""}">
        <span class="rk">${r.rank}.</span><span class="nm">${esc(r.name)}</span>
        <span class="pf">${esc(r.profile)}</span><span class="sc">${r.score}</span>
      </div>`).join("") || `<p class="empty">Zatím nikdo nedorazil do cíle. Kdo bude první?</p>`;
    $("cats").innerHTML = Object.entries(d.categories).map(([k, list]) => `
      <div class="card cat" style="--c:${METRICS[k].color}">
        <div class="eyebrow">Nejlepší v kategorii</div>
        <h2 style="margin:.1em 0 .3em">${esc(METRICS[k].name)}</h2>
        ${list.length ? `<ol>${list.map((r) => `<li>${esc(r.name)}<span>${signed(r.metrics[k])}</span></li>`).join("")}</ol>` : `<span class="empty">–</span>`}
      </div>`).join("");
    $("err").textContent = "";
  } catch {
    $("err").textContent = "Spojení se serverem vypadlo, zkouším znovu…";
  }
}

const q = qrcode(0, "M");
q.addData(location.origin + "/");
q.make();
$("joinQr").innerHTML = q.createSvgTag({ cellSize: 6, margin: 1, scalable: true });

load();
setInterval(load, 15000);
</script>
</body>
</html>
