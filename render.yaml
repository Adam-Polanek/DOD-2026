# Render Blueprint – volitelné. Umožní nasazení „na jedno kliknutí".
# Pro DEN AKCE doporučeno plan: starter + disk (data přežijí restart).
services:
  - type: web
    name: dod-trasa
    runtime: node
    plan: starter            # pro test lze "free"; na free se ale data mažou při uspání
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        sync: false           # zadáš ručně v Renderu (tajné heslo)
      - key: DB_PATH
        value: /data/dod.sqlite
    disk:                     # trvalé úložiště pro databázi (jen placený plan)
      name: dod-data
      mountPath: /data
      sizeGB: 1
